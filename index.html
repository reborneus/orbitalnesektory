<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbitálne Sektory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  ORBITÁLNE SEKTORY – vstupná stránka hry.
  Vzhľad je v css/style.css, logika v priečinku js/ (poradie súborov dole je dôležité, každý používa veci z predchádzajúcich).
  Prehľad súborov: js/README.txt. 3D grafika: knižnica three.js r128 z CDN (cdnjs), písma z Google Fonts.
  build.py z týchto súborov poskladá jeden súbor dist/orbitalne-sektory.html (pre Claude a na offline stiahnutie).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="icon" href="assets/icon-64.png">
<link rel="apple-touch-icon" href="assets/icon-256.png">
<!-- v0.29: hra ako aplikácia na ploche telefónu (iOS: Zdieľať → Pridať na plochu, Android: ⋮ → Inštalovať aplikáciu) – celá obrazovka bez lišty prehliadača -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sektory">
<meta name="theme-color" content="#04070d">
<link rel="stylesheet" href="css/style.css?v=0.50.2">
</head>
<body>
<!-- 3D plátno hry (celá obrazovka) -->
<canvas id="c" tabindex="0" aria-label="Sector"></canvas>

<!-- Horný HUD; texty s atribútom data-t sa plnia z prekladov (L10N) podľa jazyka -->
<div class="hud-top">
  <div class="sector glass">
    <div class="sec-row"><span class="sec-name" id="secName">Kepler-12</span><span class="tag" id="secTag"></span><span class="arbtns" id="arBtns" hidden></span></div>
    <!-- v0.11: úroveň pilota a body skúsenosti; ťuknutím (alebo klávesom L) sa otvorí panel Pilot -->
    <button class="pilotb" id="pilotBtn" type="button"><span class="plv" id="plvTxt">Lv 1</span><div class="bar"><i id="xpBar" style="width:0%"></i></div><span class="num" id="xpTxt"></span></button>
    <div class="inf"><div class="bar"><i id="infBar" style="width:12%"></i></div><span class="num" id="infTxt"></span></div>
    <div class="mtrack" id="mTrack" hidden></div>
    <div class="meter" id="stRow" hidden><span class="lbl" data-t="hud.station"></span><div class="bar"><i id="stBar" style="width:100%"></i></div><span class="num" id="stTxt"></span></div>
  </div>
  <div class="rcol">
    <div class="res glass">
      <div class="res-row">
        <div class="r ore"><span class="gem"></span><b id="oreTxt">0</b><small data-t="res.ore"></small></div>
        <div class="r grn"><span class="gem"></span><b id="grnTxt">0</b><small data-t="res.green"></small></div>
        <div class="r cry"><span class="gem"></span><b id="cryTxt">0</b><small data-t="res.crystal"></small></div>
        <div class="r crd"><span class="coin"></span><b id="crTxt">0</b><small data-t="res.cr"></small></div>
      </div>
      <div class="meter" id="cargoRow"><span class="lbl" data-t="hud.cargo"></span><div class="bar"><i id="cOre" style="width:0"></i><i id="cGrn" style="width:0"></i><i id="cCry" style="width:0"></i></div><span class="num" id="cargoTxt">0/50</span></div>
      <div class="meter" id="rsRow" hidden><span class="lbl" data-t="hud.rad"></span><div class="bar"><i id="rsBar" style="width:0"></i></div><span class="num" id="rsTxt">0 s</span></div>
      <div class="meter" id="shRow" hidden><span class="lbl" data-t="hud.shield"></span><div class="bar"><i id="shBar" style="width:0"></i></div><span class="num" id="shTxt">0/0</span></div>
      <div class="meter"><span class="lbl" data-t="hud.hull"></span><div class="bar"><i id="hpBar" style="width:100%"></i></div><span class="num" id="hpTxt">100/100</span></div>
      <div class="status" id="statusTxt"></div>
    </div>
    <!-- v0.25: minimapa v obale s tlačidlami zmenšiť / zväčšiť -->
    <div class="miniwrap" id="miniWrap"><canvas id="mini" width="300" height="300"></canvas><div class="minictl"><button type="button" data-mz="-1" aria-label="−">−</button><button type="button" data-mz="1" aria-label="+">+</button></div></div>
  </div>
</div>

<!-- Efekty okrajov obrazovky: radv = radiácia/horizont, hurt = náraz a nízky trup -->
<div id="radv"></div>
<div id="hurt"></div>
<div id="toasts" aria-live="polite"></div>

<div class="hud-bottom">
  <p class="hint" id="hint"></p>
  <nav class="dock glass" aria-label="Menu">
    <button data-tab="station"><span class="pg" data-g="Y"></span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="9.5" ry="4"/><path d="M12 2.5v3M12 18.5v3"/></svg><span data-t="dock.station"></span></button>
    <button data-tab="ship"><span class="pg" data-g="X"></span><svg viewBox="0 0 24 24"><path d="M7 3.5c-3 2.5-3.5 7-1 9.5M17 3.5c3 2.5 3.5 7 1 9.5"/><path d="M9 9.5h6l1.5 8-4.5 3-4.5-3z"/></svg><span data-t="dock.ship"></span></button>
    <button data-tab="gear"><span class="pg" data-g="LT"></span><svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/></svg><span data-t="dock.gear"></span></button>
    <button data-tab="map"><span class="pg" data-g="M"></span><svg viewBox="0 0 24 24"><path d="M7 3.5l5 2.9v5.8l-5 2.9-5-2.9V6.4z"/><path d="M17 9.5l5 2.9v5.8l-5 2.9-5-2.9"/></svg><span data-t="dock.map"></span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span data-t="dock.settings"></span></button>
    <button id="wikiBtn"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 10.5h7"/></svg><span>Wiki</span></button>
    <button id="homeBtn"><span class="pg" data-g="B"></span><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6.5 9.5V20h11V9.5"/><path d="M10 20v-5h4v5"/></svg><span data-t="dock.home"></span></button>
  </nav>
</div>

<!-- Menu: obsah #sheetBody vykresľuje funkcia renderSheet() v JS -->
<section class="sheet" id="sheet" hidden>
  <header><h2 id="sheetTitle"></h2><button class="close" id="sheetClose" data-t="sh.close"></button></header>
  <div class="body" id="sheetBody"></div>
</section>

<!-- v0.30: Hlavné menu – obsah vykresľuje renderMenu() v js/menu.js, za ním beží fanart (js/menuart.js) -->
<div class="intro menu" id="intro">
  <div class="mpanel" id="introBox"></div>
  <aside class="mlog glass" id="menuLog" hidden></aside>
</div>
<!-- Príručka (wiki): obsah vykresľuje renderWiki() v js/wiki.js -->
<div class="wiki" id="wiki" hidden></div>
<!-- Obrazovka smrti: odpočet do znovuzrodenia (deathScreen v js/control.js) -->
<div class="death" id="death" aria-live="assertive"><div class="deathBox">
  <svg class="deathSkull" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4C17 4 7 14 7 28c0 8 4 14 9 17v8c0 3 2 5 5 5h22c3 0 5-2 5-5v-8c5-3 9-9 9-17C57 14 47 4 32 4z" fill="currentColor"/><circle cx="21.5" cy="29" r="7" fill="#12030a"/><circle cx="42.5" cy="29" r="7" fill="#12030a"/><path d="M32 37l-4.5 7h9z" fill="#12030a"/><rect x="24" y="50" width="3" height="8" fill="#12030a"/><rect x="30.5" y="50" width="3" height="8" fill="#12030a"/><rect x="37" y="50" width="3" height="8" fill="#12030a"/></svg>
  <h2 id="deathT"></h2><p id="deathLost"></p>
  <div class="deathN" id="deathN">5</div><div class="deathBarW"><i id="deathBar"></i></div><p class="deathSub" id="deathSub"></p>
  <div class="deathBtns" id="deathBtns"><button class="go" id="respBase" disabled></button><button class="ghost" id="respFull" disabled></button></div>
</div></div>
<div class="warp" id="warp"></div>
