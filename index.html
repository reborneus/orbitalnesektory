<title>Orbitálne Sektory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas; HUD glass strips pinned top (sector left, resources + minimap right) and bottom (hint + dock); menus as a bottom sheet. Single committed dark look. */
:root{
  --void:#04070d;
  --panel:rgba(9,15,27,.78);
  --panel-solid:#0b1322;
  --line:rgba(130,175,215,.16);
  --text:#dde7f1;
  --muted:#8597ab;
  --hull:#58d0c0;
  --ore:#f0a644;
  --green:#86e05a;
  --crystal:#a98bff;
  --shield:#5aa9ff;
  --warn:#ff7b6b;
  --gold:#ffd27a;
  --f-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--text)}
body{font-family:var(--f-display);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--hull);outline-offset:2px}

.hud-top{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-start}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sector{padding:8px 12px;min-width:0;flex:1 1 200px;max-width:340px;display:grid;gap:6px}
.sec-row{display:flex;align-items:baseline;gap:8px;min-width:0}
.sec-name{font-weight:700;font-size:17px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag.won{color:var(--gold);border-color:rgba(255,210,122,.45)}
.inf{display:flex;align-items:center;gap:8px}
.bar{position:relative;flex:1;min-width:60px;height:6px;border-radius:3px;background:rgba(130,175,215,.12);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .25s ease}
#infBar{background:var(--hull);box-shadow:0 0 10px var(--hull)}
#infBar.won{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap;min-width:5.5ch;text-align:right}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}
.res{padding:8px 12px;display:grid;gap:6px;min-width:0;width:270px;max-width:100%}
.res-row{display:flex;gap:12px;justify-content:space-between}
.r{display:flex;align-items:center;gap:6px}
.r b{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
.r small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.gem{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;flex:none}
.ore .gem{background:var(--ore);box-shadow:0 0 8px var(--ore)}
.grn .gem{background:var(--green);box-shadow:0 0 8px var(--green)}
.cry .gem{background:var(--crystal);box-shadow:0 0 8px var(--crystal)}
.meter{display:flex;align-items:center;gap:8px}
.meter .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;width:5.6em}
#cOre{background:var(--ore)} #cGrn{background:var(--green)} #cCry{background:var(--crystal)}
.meter.full .lbl,.meter.full .num{color:var(--warn)}
#shBar{background:var(--shield);box-shadow:0 0 8px var(--shield)}
#hpBar{background:var(--hull);box-shadow:0 0 8px var(--hull)}
#hpBar.mid{background:var(--ore);box-shadow:0 0 8px var(--ore)}
#hpBar.low{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.status{font-size:11.5px;color:var(--muted);min-height:1.3em;line-height:1.3}
.status.ok{color:var(--hull)} .status.sh{color:var(--shield)} .status.warn{color:var(--ore)} .status.bad{color:var(--warn);font-weight:600}
#mini{pointer-events:auto;width:150px;height:150px;border-radius:50%;border:1px solid var(--line);background:rgba(6,11,20,.6);cursor:crosshair;touch-action:none;display:block}
kbd{font-family:var(--f-data);font-size:12px;font-weight:700;padding:0 6px;margin:0 1px;border:1px solid rgba(221,231,241,.4);border-bottom-width:2px;border-radius:5px;background:rgba(9,15,27,.75);color:var(--text)}
.pg{display:none;position:absolute;top:3px;right:5px;font-family:var(--f-data);font-size:10px;line-height:1;padding:2px 4px;border-radius:4px;background:rgba(221,231,241,.14);color:var(--text);letter-spacing:0;text-transform:none}
body.pad .pg{display:block}
.pad-focus{outline:2px solid var(--hull);outline-offset:2px;box-shadow:0 0 18px rgba(88,208,192,.25)}
#hurt,#radv{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0}
#hurt{box-shadow:inset 0 0 120px 30px rgba(255,80,60,.75)}
#hurt.low{opacity:.3;animation:lowhp 1.4s ease-in-out infinite}
#hurt.on{animation:hurt .5s ease-out}
#radv{box-shadow:inset 0 0 140px 40px rgba(240,166,68,.7);transition:opacity .3s}
#radv.void{box-shadow:inset 0 0 160px 60px rgba(255,59,47,.85)}
@keyframes hurt{0%{opacity:var(--k,.6)}100%{opacity:0}}
@keyframes lowhp{50%{opacity:.1}}
.pulse{animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);z-index:6;display:grid;gap:6px;justify-items:center;align-content:end;pointer-events:none;width:min(92vw,440px)}
.toast{padding:8px 14px;border-radius:8px;background:var(--panel-solid);border:1px solid var(--line);font-size:14px;font-weight:500;text-align:center;animation:tin .25s ease both}
.toast.big{border-color:rgba(255,210,122,.5);color:var(--gold);font-weight:700;font-size:16px}
.toast.bad{border-color:rgba(255,123,107,.55);color:var(--warn);font-weight:700}
.toast.out{animation:tout .4s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(6px)}}

.hud-bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;display:grid;justify-items:center;gap:8px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-top:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hint{margin:0;max-width:46ch;text-align:center;font-size:14px;color:var(--text);text-shadow:0 1px 6px #000,0 0 2px #000;min-height:1.3em;text-wrap:balance}
.dock{pointer-events:auto;display:flex;gap:6px;padding:6px;width:min(100%,460px)}
.dock button{position:relative;flex:1;min-width:0;display:grid;justify-items:center;gap:2px;padding:7px 4px 6px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.dock button:hover,.dock button.on{color:var(--text);background:rgba(88,208,192,.10)}
.dock button.on{color:var(--hull)}

.sheet{position:fixed;z-index:8;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);max-height:70%;display:flex;flex-direction:column;
  background:var(--panel-solid);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:sheetIn .22s ease}
@keyframes sheetIn{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em;flex:1;text-wrap:balance}
.close{border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:600}
.sheet .body{overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;-webkit-overflow-scrolling:touch}
.sec-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:6px 0 -2px;display:flex;justify-content:space-between;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:rgba(255,255,255,.015)}
.card h3{margin:0;font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3 .lv{font-family:var(--f-data);font-size:11.5px;color:var(--hull);font-weight:500}
.card p{margin:0;grid-column:1/-1;color:var(--muted);font-size:13.5px;line-height:1.4;max-width:60ch}
.card .stat{grid-column:1/-1;font-family:var(--f-data);font-size:12px;color:var(--text)}
.card .stat em{font-style:normal;color:var(--hull)}
.costs{display:flex;gap:10px;align-items:center;grid-column:1/2;flex-wrap:wrap}
.cost{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-data);font-size:13px;font-weight:700}
.cost .gem{width:7px;height:7px}
.cost.ore .gem{background:var(--ore)} .cost.grn .gem{background:var(--green)} .cost.cry .gem{background:var(--crystal)}
.cost.lack{color:var(--warn)}
.cost.gain{color:var(--hull)}
.act.sell{border-color:rgba(255,123,107,.45);background:rgba(255,123,107,.08);color:var(--warn)}
.act{grid-column:2;grid-row:1/span 2;align-self:start;border:1px solid rgba(88,208,192,.5);background:rgba(88,208,192,.12);color:var(--hull);border-radius:8px;padding:8px 14px;font-weight:700;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.act:disabled{opacity:.38;cursor:not-allowed}
.act.max{border-color:var(--line);background:transparent;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px}
.seg{border:0;background:transparent;border-radius:6px;padding:8px 4px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;min-width:0}
.seg[aria-pressed="true"]{background:rgba(88,208,192,.14);color:var(--hull)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:34px;height:30px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:rgba(130,175,215,.12);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--void)}
.slot.drone{background:var(--ore)} .slot.tower{background:var(--warn)} .slot.sensor{background:var(--crystal)}
.slot.lock{background:rgba(130,175,215,.04);outline:1px dashed rgba(130,175,215,.18);outline-offset:-1px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:2px 0 0}
.chip{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.chip.here{color:var(--hull);border-color:rgba(88,208,192,.45)}
.chip.won{color:var(--gold);border-color:rgba(255,210,122,.45)}
.gems{display:inline-flex;gap:6px;align-items:center;grid-column:1/-1}
.gems .gem{width:8px;height:8px}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600;justify-self:start}
.ghost.danger{color:var(--warn);border-color:rgba(255,123,107,.45)}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;align-self:center}
.langb{border:0;background:transparent;padding:6px 11px;font-weight:700;color:var(--muted);cursor:pointer;font-size:12px;letter-spacing:.08em}
.langb[aria-pressed="true"]{background:rgba(88,208,192,.16);color:var(--hull)}
.card .langs{grid-column:2;grid-row:1}

.intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow:auto;background:radial-gradient(ellipse at 50% 40%,rgba(4,7,13,.55),rgba(4,7,13,.92));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.intro .box{width:min(100%,440px);display:grid;gap:14px;padding:22px 20px}
.intro-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kicker{font-family:var(--f-data);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--hull)}
.intro h1{margin:0;font-size:38px;line-height:1;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.intro ol{margin:0;padding:0;list-style:none;display:grid;gap:9px;counter-reset:s}
.intro li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14.5px;line-height:1.4;color:var(--text)}
.intro li::before{counter-increment:s;content:counter(s);font-family:var(--f-data);font-size:11px;color:var(--hull);border:1px solid rgba(88,208,192,.4);border-radius:4px;height:18px;display:grid;place-items:center;margin-top:1px}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.diff{border:1px solid var(--line);border-radius:9px;padding:10px 12px;text-align:left;background:transparent;cursor:pointer;display:grid;gap:4px;align-content:start}
.diff b{font-size:17px}
.diff span{font-size:12.5px;color:var(--muted);line-height:1.35}
.diff[aria-pressed="true"]{border-color:var(--hull);background:rgba(88,208,192,.10)}
.diff.hard[aria-pressed="true"]{border-color:var(--warn);background:rgba(255,123,107,.08)}
.go{border:0;border-radius:9px;padding:13px;background:var(--hull);color:#04221e;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.warp{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#e9fffb 0,#58d0c0 18%,rgba(4,7,13,.95) 60%);transition:opacity .45s ease}
.warp.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast,.sheet,.pulse{animation:none}.warp,#radv{transition:none}}
@media (max-width:600px){
  .sector{flex-basis:100%;max-width:none}
  .rcol{flex:1 1 100%;align-items:stretch}
  .res{width:auto}
  #mini{width:112px;height:112px;align-self:flex-end}
  .r small{display:none}
}
</style>

<canvas id="c" tabindex="0" aria-label="Sector"></canvas>

<div class="hud-top">
  <div class="sector glass">
    <div class="sec-row"><span class="sec-name" id="secName">Kepler-12</span><span class="tag" id="secTag"></span></div>
    <div class="inf"><div class="bar"><i id="infBar" style="width:12%"></i></div><span class="num" id="infTxt"></span></div>
  </div>
  <div class="rcol">
    <div class="res glass">
      <div class="res-row">
        <div class="r ore"><span class="gem"></span><b id="oreTxt">0</b><small data-t="res.ore"></small></div>
        <div class="r grn"><span class="gem"></span><b id="grnTxt">0</b><small data-t="res.green"></small></div>
        <div class="r cry"><span class="gem"></span><b id="cryTxt">0</b><small data-t="res.crystal"></small></div>
      </div>
      <div class="meter" id="cargoRow"><span class="lbl" data-t="hud.cargo"></span><div class="bar"><i id="cOre" style="width:0"></i><i id="cGrn" style="width:0"></i><i id="cCry" style="width:0"></i></div><span class="num" id="cargoTxt">0/50</span></div>
      <div class="meter" id="shRow" hidden><span class="lbl" data-t="hud.shield"></span><div class="bar"><i id="shBar" style="width:0"></i></div><span class="num" id="shTxt">0/0</span></div>
      <div class="meter"><span class="lbl" data-t="hud.hull"></span><div class="bar"><i id="hpBar" style="width:100%"></i></div><span class="num" id="hpTxt">100/100</span></div>
      <div class="status" id="statusTxt"></div>
    </div>
    <canvas id="mini" width="300" height="300"></canvas>
  </div>
</div>

<div id="radv"></div>
<div id="hurt"></div>
<div id="toasts" aria-live="polite"></div>

<div class="hud-bottom">
  <p class="hint" id="hint"></p>
  <nav class="dock glass" aria-label="Menu">
    <button data-tab="station"><span class="pg" data-g="Y"></span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="9.5" ry="4"/><path d="M12 2.5v3M12 18.5v3"/></svg><span data-t="dock.station"></span></button>
    <button data-tab="ship"><span class="pg" data-g="X"></span><svg viewBox="0 0 24 24"><path d="M7 3.5c-3 2.5-3.5 7-1 9.5M17 3.5c3 2.5 3.5 7 1 9.5"/><path d="M9 9.5h6l1.5 8-4.5 3-4.5-3z"/></svg><span data-t="dock.ship"></span></button>
    <button data-tab="map"><span class="pg" data-g="M"></span><svg viewBox="0 0 24 24"><path d="M7 3.5l5 2.9v5.8l-5 2.9-5-2.9V6.4z"/><path d="M17 9.5l5 2.9v5.8l-5 2.9-5-2.9"/></svg><span data-t="dock.map"></span></button>
    <button id="homeBtn"><span class="pg" data-g="B"></span><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6.5 9.5V20h11V9.5"/><path d="M10 20v-5h4v5"/></svg><span data-t="dock.home"></span></button>
  </nav>
</div>

<section class="sheet" id="sheet" hidden>
  <header><h2 id="sheetTitle"></h2><button class="close" id="sheetClose" data-t="sh.close"></button></header>
  <div class="body" id="sheetBody"></div>
</section>

<div class="intro" id="intro">
  <div class="box glass" id="introBox"></div>
</div>
<div class="warp" id="warp"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

function repairCard(){const hm=shipVal('hull');const cost=Math.ceil((hm-state.hp)/2);const near=nearStation();
  return `<div class="card"><h3>${t('rep.name')}</h3><button class="act" data-act="repair" data-ore="1" data-green="0" data-cry="0" data-block="${near?0:1}">${t('btn.repair')}</button><div class="costs">${costHtml(C(cost))}</div><p>${near?t('rep.desc'):t('rep.far')}</p><div class="stat">${t('rep.stat',{a:Math.ceil(state.hp),b:hm})}</div></div>`}
function renderSheet(){if(!sheetTab||!state)return;const s=cur();let h='';
  if(sheetTab==='station'){$('#sheetTitle').textContent=t('sh.station',{s:secName(state.cur)});const inf=influence(s),cap=capOf(state.cur);
    if(state.hp<shipVal('hull')-.5)h+=repairCard();
    const L=s.core;
    h+=`<div class="card"><h3>${t('core.name')} <span class="lv">${t('lv',{n:L,m:CORE_MAX})}</span></h3>`;
    if(L<CORE_MAX){const cc=coreCost(L);h+=actBtn('core',t('btn.upgrade'),cc,false)+`<div class="costs">${costHtml(cc)}</div><p>${t('core.next')}</p>`}
    else h+=`<button class="act max" disabled>${t('btn.max')}</button><p>${t('core.max')}</p>`;
    h+=`<div class="stat">${t('core.stat',{s:slotsFor(L),i:L*CORE_INF})}</div></div>`;
    const n=slotsFor(L),free=freeSlot(s);
    h+=`<div class="sec-h"><span>${t('mods')}</span><span>${t('slotsOf',{a:s.slots.slice(0,n).filter(Boolean).length,b:n})}</span></div><div class="slots">`;
    for(let i=0;i<6;i++){const m=s.slots[i];h+=i<n?`<span class="slot ${m||''}" title="${m?t('mod.'+m):''}">${m?t('mod.'+m+'.s'):''}</span>`:'<span class="slot lock"></span>'}h+='</div>';
    for(const k of Object.keys(MOD)){const md=MOD[k];const cnt=countMod(s,k);const c=md.cost(cnt);
      h+=`<div class="card"><h3>${t('mod.'+k)} <span class="lv">${t('mod.inf',{n:cnt,i:md.inf})}</span></h3>${actBtn('mod',free<0?t('btn.noslot'):t('btn.build'),c,free<0,`data-mod="${k}"`)}<div class="costs">${costHtml(c)}</div><p>${t('mod.'+k+'.d')}</p></div>`}
    const built=[];for(let i=0;i<n;i++)if(s.slots[i])built.push(i);
    if(built.length){h+=`<div class="sec-h"><span>${t('mods.built')}</span></div>`;
      for(const i of built){const k=s.slots[i];const r=refundOf(s,k);
        h+=`<div class="card"><h3>${t('mod.'+k)} <span class="lv">${t('slotN',{n:i+1})} · −${MOD[k].inf}</span></h3><button class="act sell" data-act="sell" data-i="${i}">${t('btn.sell')}</button><div class="costs">${refundHtml(r)}</div><p>${t('sell.d')}</p></div>`}}
    h+=`<p class="note">${s.captured?t('st.noteWon'):state.cur<SECTORS.length-1?t('st.note',{a:inf,b:cap}):t('st.noteLast',{a:inf,b:cap})}</p>`}
  else if(sheetTab==='ship'){$('#sheetTitle').textContent=t('sh.ship');
    h+=`<div class="segs">${GROUPS.map(g=>`<button class="seg" data-act="grp" data-g="${g}" aria-pressed="${g===shipGrp}">${t('grp.'+g)}</button>`).join('')}</div>`;
    for(const k of Object.keys(UP))if(UP[k].grp===shipGrp)h+=upCard(k);
    if(shipGrp==='hull'&&state.hp<shipVal('hull')-.5)h+=repairCard();
    h+=`<p class="note">${t('note.ship',{a:Math.ceil(state.hp),b:shipVal('hull'),regen:D().regen?t('note.easy'):t('note.hard')})}</p>`}
  else if(sheetTab==='map'||sheetTab==='gate'){const isGate=sheetTab==='gate';$('#sheetTitle').textContent=isGate?t('sh.gate'):t('sh.map');
    if(isGate)h+=`<p class="note">${t('gate.note')}</p>`;
    SECTORS.forEach((S,i)=>{const sc=state.sec[i];const here=i===state.cur;
      const chip=here?`<span class="chip here">${t('chip.here')}</span>`:sc.captured?`<span class="chip won">${t('chip.won')}</span>`:sc.unlocked?`<span class="chip">${t('chip.free')}</span>`:`<span class="chip">${t('chip.locked')}</span>`;
      h+=`<div class="card"><h3>${secName(i)} ${chip}</h3>`;
      if(isGate){if(here)h+=`<button class="act max" disabled>${t('btn.here')}</button>`;
        else if(sc.unlocked)h+=`<button class="act" data-act="jump" data-i="${i}">${t('btn.jump')}</button>`;
        else h+=`<button class="act max" disabled>${t('btn.locked')}</button>`}
      h+=`<span class="gems">${S.res.map(r=>`<span class="gem" style="background:${RCOL[r]}" title="${t('res.'+r)}"></span>`).join('')}</span>`;
      h+=`<p>${t('sec'+i+'.sub')} ${sc.unlocked?t('map.inf',{a:influence(sc),b:S.capture}):t('map.lock',{s:secName(i-1)})}</p>`;
      const inc=sc.captured?passiveOf(sc):null;
      if(inc&&(inc.ore>0||inc.green>0))h+=`<div class="stat">${t('map.income',{o:Math.round(inc.ore*60),g:Math.round(inc.green*60)})}</div>`;
      h+='</div>'});
    if(isGate){body.innerHTML=h;refreshSheet();applyFocus();return}
    h+=`<p class="note">${t('map.gateNote')}</p>`;
    h+=`<div class="sec-h"><span>${t('set.h')}</span></div>`;
    const onoff=(k,on)=>`<div class="langs"><button class="langb" data-act="opt" data-k="${k}" data-v="1" aria-pressed="${on}">${t('on')}</button><button class="langb" data-act="opt" data-k="${k}" data-v="0" aria-pressed="${!on}">${t('off')}</button></div>`;
    h+=`<div class="sec-h"><span>${t('set.autoH')}</span></div>`;
    h+=`<div class="card"><h3>${t('set.ap')}</h3>${onoff('autoPilot',!!state.autoPilot)}<p>${t('set.ap.d',{V:G().V})}</p>
      <div class="gems" style="gap:8px;flex-wrap:wrap"><span class="note" style="margin:0">${t('set.ap.res')}:</span>${RES.map(r=>`<button class="langb" style="border:1px solid var(--line);border-radius:6px;display:inline-flex;gap:6px;align-items:center" data-act="ares" data-r="${r}" aria-pressed="${state.autoRes===r}"><span class="gem" style="background:${RCOL[r]}"></span>${t('res.'+r)}</button>`).join('')}</div>
      ${SECTORS[state.cur].res.includes(state.autoRes)?'':`<div class="stat" style="color:var(--warn)">${t('set.ap.miss',{r:t('res.'+state.autoRes)})}</div>`}</div>`;
    h+=`<div class="card"><h3>${t('set.ret')}</h3>${onoff('autoReturn',state.autoReturn!==false)}<p>${t('set.ret.d')}</p></div>`;
    h+=`<div class="card"><h3>${t('set.auto')}</h3>${onoff('autoMine',state.autoMine!==false)}<p>${t('set.auto.d')}</p></div>`;
    h+=`<div class="card"><h3>${t('set.lang')}</h3>${langBtns()}<p>${t('set.diff',{d:t('diff.'+state.diff)})}</p></div>`;
    h+=`<p class="note">${t('save.note')}</p><button class="ghost danger" id="resetBtn">${t('btn.reset')}</button>`}
  body.innerHTML=h;refreshSheet();applyFocus()}
function refreshSheet(){if(!sheetTab)return;
  body.querySelectorAll('[data-need]').forEach(el=>el.classList.toggle('lack',state[el.dataset.need]<+el.dataset.n));
  body.querySelectorAll('.act[data-ore]').forEach(b=>{b.disabled=b.dataset.block==='1'||state.ore<+b.dataset.ore||state.green<+b.dataset.green||state.crystal<+b.dataset.cry})}
function focusables(){return[...body.querySelectorAll('.seg,.act,.langb,.ghost')]}
function applyFocus(){body.querySelectorAll('.pad-focus').forEach(el=>el.classList.remove('pad-focus'));if(inputMode!=='pad'||!sheetTab)return;
  const f=focusables();if(!f.length)return;focusIdx=clamp(focusIdx,0,f.length-1);const el=f[focusIdx];const box=el.classList.contains('act')?(el.closest('.card')||el):el;
  box.classList.add('pad-focus');box.scrollIntoView({block:'nearest',behavior:'smooth'})}
function moveFocus(v){focusIdx+=v;applyFocus()}
function activateFocus(){const el=focusables()[focusIdx];if(!el)return;if(!el.disabled){el.click();return}
  if(el.dataset.act==='repair')toast(t('rep.far'));else if(el.dataset.block==='1')toast(t('tt.noSlot'));else if(el.dataset.ore)toast(t('tt.noRes'))}
let resetArm=0;
body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='resetBtn'){if(performance.now()-resetArm<3000){newGame();return}
    resetArm=performance.now();b.textContent=t('btn.resetSure');setTimeout(()=>{if(b.isConnected)b.textContent=t('btn.reset')},3000);return}
  const act=b.dataset.act;if(!act||b.disabled)return;const s=cur();
  if(act==='grp'){shipGrp=b.dataset.g;focusIdx=GROUPS.indexOf(shipGrp);renderSheet();return}
  if(act==='lang'){setLang(b.dataset.l);return}
  if(act==='opt'){const k=b.dataset.k,v=b.dataset.v==='1';if(k==='autoPilot'){if(!!state.autoPilot!==v)toggleAutopilot();return}state[k]=v;save();renderSheet();return}
  if(act==='ares'){state.autoRes=b.dataset.r;save();renderSheet();if(state.autoPilot)toast(t('tt.apOn',{r:t('res.'+state.autoRes)}));return}
  if(act==='repair'){if(!nearStation()){toast(t('rep.far'));return}const hm=shipVal('hull');const need=Math.ceil((hm-state.hp)/2);const n=Math.min(need,Math.floor(state.ore));
    if(n<=0)return;state.ore-=n;const before=state.hp;state.hp=Math.min(hm,state.hp+n*2);toast(t('tt.repaired',{n:Math.round(state.hp-before)}));changed();return}
  if(act==='sell'){const i=+b.dataset.i;const k=s.slots[i];if(!k)return;
    if(!b.dataset.arm||performance.now()-(+b.dataset.arm)>3000){b.dataset.arm=performance.now();b.textContent=t('btn.sellSure');setTimeout(()=>{if(b.isConnected)b.textContent=t('btn.sell')},3000);return}
    const r=refundOf(s,k);s.slots[i]=null;const parts=[];for(const x of RES){state[x]+=r[x];if(r[x])parts.push(t('res.'+x+'.gain',{n:r[x]}))}
    rebuildStation();toast(t('tt.sold',{m:t('mod.'+k),list:parts.join(', ')}));changed();return}
  if(act==='core'){const c=coreCost(s.core);if(s.core<CORE_MAX&&afford(c)){pay(c);s.core++;rebuildStation();toast(t('tt.coreUp',{n:s.core}));changed()}}
  else if(act==='mod'){const k=b.dataset.mod;const i=freeSlot(s);const c=MOD[k].cost(countMod(s,k));if(i>=0&&afford(c)){pay(c);s.slots[i]=k;rebuildStation();toast(t('tt.built',{m:t('mod.'+k)}));changed()}}
  else if(act==='ship'){const k=b.dataset.k;const u=UP[k];const L=state.ship[k];const c=u.cost(L);if(L<u.max&&afford(c)){pay(c);
      if(k==='shield'){const before=shieldMax();state.ship[k]++;state.sh=Math.min(shieldMax(),state.sh+(shieldMax()-before));if(L===0){state.sh=shieldMax();toast(t('tt.shieldOn'))}else toast(t('tt.upg',{m:t('up.'+k),n:state.ship[k]}))}
      else{state.ship[k]++;if(k==='hull')state.hp+=40;toast(t('tt.upg',{m:t('up.'+k),n:state.ship[k]}))}
      changed()}}
  else if(act==='jump'){if(!gate||ship.position.distanceTo(gate.position)>18){toast(t('gate.far'));return}closeSheet();jumpTo(+b.dataset.i)}});
function changed(){checkCapture();save();renderSheet();updateHUD()}
function checkCapture(){const s=cur();if(!s.captured&&influence(s)>=capOf(state.cur)){s.captured=true;const nx=state.sec[state.cur+1];if(nx)nx.unlocked=true;rebuildStation();updateGate();
  if(nx)toast(t('tt.captured',{s:secName(state.cur),n:secName(state.cur+1)}),true);
  else if(state.sec.every(x=>x.captured))toast(t('tt.capturedAll'),true);
  else toast(t('tt.capturedOne',{s:secName(state.cur)}),true)}}
function passiveOf(sc){return{ore:countMod(sc,'drone')*.7,green:countMod(sc,'sensor')*.06}}

let jumping=false;
function jumpTo(i,instant){if(jumping)return;jumping=true;const w=$('#warp');w.classList.add('on');
  mining=false;mineTarget=null;moveTarget=null;hideBeam(beam);
  setTimeout(()=>{try{state.cur=i;mining=false;mineTarget=null;moveTarget=null;openOnArrive=false;stationG=null;gateNear=true;
    ship.position.set(0,0,STATION_R+8);shipVel.set(0,0,0);shipYaw=0;lastZone=1;buildSector();camTarget.copy(ship.position);save();updateHUD();
    if(!instant)toast(t('tt.jumped',{s:secName(i)}))}catch(e){console.error(e)}finally{w.classList.remove('on');jumping=false}},instant?50:480)}

/* language + intro */
let pendingDiff='easy';
function setLang(l){lang=l;if(state)state.lang=l;try{localStorage.setItem('os-lang',l)}catch(e){}applyLang();if(state)save()}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  mini.setAttribute('aria-label',t('mini'));if(!$('#intro').hidden)renderIntro();renderSheet();lastHint='';updateHUD()}
function renderIntro(){$('#introBox').innerHTML=`<div class="intro-top"><div class="kicker">${t('in.kicker')}</div>${langBtns()}</div>
  <h1>Orbitálne Sektory</h1><ol>${[1,2,3,4,5].map(i=>`<li>${t('in.'+i)}</li>`).join('')}</ol>
  <div class="sec-h"><span>${t('in.diff')}</span></div>
  <div class="diffs">${['easy','hard'].map(d=>`<button class="diff ${d}" data-d="${d}" aria-pressed="${pendingDiff===d}"><b>${t('diff.'+d)}</b><span>${t('diff.'+d+'D')}</span></button>`).join('')}</div>
  <button class="go" id="goBtn">${t('in.go')}</button>`}
$('#introBox').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.l){setLang(b.dataset.l);return}if(b.dataset.d){pendingDiff=b.dataset.d;renderIntro();return}if(b.id==='goBtn')startGame()});
function startGame(){state.diff=pendingDiff;state.intro=true;state.hp=shipVal('hull');$('#intro').hidden=true;save();lastHint='';updateHUD();canvas.focus()}
function newGame(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}state=freshState();closeSheet();for(const a of asts)a.claims=0;
  dead=false;ship.visible=true;hullSince=99;shSince=99;pendingDiff='easy';$('#intro').hidden=false;renderIntro();jumpTo(0,true);toast(t('tt.newGame'))}

document.querySelectorAll('.dock [data-tab]').forEach(b=>b.addEventListener('click',()=>toggleTab(b.dataset.tab)));
$('#sheetClose').addEventListener('click',closeSheet);
$('#homeBtn').addEventListener('click',goHome);

/* ---------- loop ---------- */
const camTarget=new V3();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?52:40;camera.updateProjectionMatrix();sizeMini()}
addEventListener('resize',resize);
const clock=new THREE.Clock();let saveT=0,incomeT=0,miniT=0,tt=0;
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);tt+=dt;
  pollPad(dt);readInput();
  const playing=$('#intro').hidden;
  if(!jumping&&!dead&&playing){tickAuto(dt);tickShip(dt,tt)}if(!jumping)tickDrones(dt,tt);
  // radiation by belt; beyond the horizon it eats the hull directly
  const rr=Math.hypot(ship.position.x,ship.position.z);radRate=0;radHull=false;
  if(!dead&&!jumping&&playing){radRate=radAt(rr);if(radRate>0){const o=damage(radRate*dt,rr>=HORIZON?'void':'rad');radHull=o.hull>0}
    const z=zoneOf(rr);if(z!==lastZone){if(z===5)toast(t('tt.horizon'),'bad');else if(z>=3&&z>lastZone)toast(t('tt.rad',{z}));lastZone=z}}
  hullSince+=dt;shSince+=dt;hitCD-=dt;
  const smax=shieldMax();if(state.sh>smax)state.sh=smax;
  if(!dead&&smax>0&&state.sh<smax){const g=shipVal('sregen');if(shSince>=g.delay)state.sh=Math.min(smax,state.sh+smax*g.rate*dt)}
  const hm=shipVal('hull');if(!dead&&D().regen&&hullSince>=HULL_DELAY&&state.hp<hm)state.hp=Math.min(hm,state.hp+hm*HULL_RATE*dt);
  const rv=$('#radv');const vOn=!dead&&radRate>0&&(radHull||rr>=HORIZON);rv.classList.toggle('void',rr>=HORIZON);
  rv.style.opacity=vOn?(rr>=HORIZON?(.45+.2*Math.sin(tt*6)).toFixed(2):clamp(radRate/10,.15,.5).toFixed(2)):'0';
  bubbleT=Math.max(0,bubbleT-dt*2.2);
  const bu=ship.userData.bubble.material.uniforms.o;const shUp=smax>0&&state.sh>0;
  bu.value=Math.max(shUp?(radRate>0&&!radHull?.35+.12*Math.sin(tt*9):.08):0,bubbleT*.9);
  for(const a of asts){
    if(a.alive){a.g.rotation.x+=a.spin.x*dt;a.g.rotation.y+=a.spin.y*dt;a.g.rotation.z+=a.spin.z*dt;if(a.shrink<1){a.shrink=Math.min(1,a.shrink+dt*.8);setAstScale(a)}}
    else{if(a.g.visible){a.shrink-=dt*3;if(a.shrink<=0){a.shrink=0;a.g.visible=false}else setAstScale(a)}
      a.respawn-=dt;if(a.respawn<=0){a.amt=a.max;a.alive=true;a.claims=0;a.shrink=.01;a.g.visible=true;placeAst(a,Math.random)}}}
  if(stationAnim){for(const r of stationAnim.rings)r.o.rotation.y+=r.s*dt;for(const tu of stationAnim.turrets)tu.o.rotation.y=Math.PI+Math.sin(tt*.5+tu.ph)*1.4;
    for(const d of stationAnim.dishes)d.o.rotation.y+=dt*.6;for(const b of stationAnim.blink){const k=b.soft?.75+.25*Math.sin(tt*3*b.f):(Math.sin(tt*TAU*b.f)>.2?1:.35);b.o.scale.setScalar(b.base*k)}}
  if(gate){gate.userData.ring.rotation.z+=dt*.4;const k=1+Math.sin(tt*2)*.12;gate.userData.core.scale.set(9*k,9*k,1)}
  if(world&&world.userData.planet)world.userData.planet.rotation.y+=dt*.01;
  tickPool(trail,dt);tickPool(debris,dt);
  if(markerT>0){markerT-=dt;const k=markerT/.6;marker.material.opacity=k*.9;marker.scale.setScalar(1+(1-k)*1.8)}else marker.material.opacity=0;
  if(mineTarget&&mineTarget.alive){tRing.visible=true;tRing.position.set(mineTarget.pos.x,mineTarget.pos.y-.2,mineTarget.pos.z);tRing.scale.setScalar(astScale(mineTarget)*1.6+1.2);tRing.rotation.z+=dt*1.2}else tRing.visible=false;
  incomeT+=dt;if(incomeT>=1){incomeT=0;state.sec.forEach((sc,i)=>{if(i!==state.cur&&sc.captured){const p=passiveOf(sc);state.ore+=p.ore;state.green+=p.green}});refreshSheet()}
  const look=ship.position.clone().addScaledVector(shipVel,.35);look.y=0;camTarget.lerp(look,1-Math.exp(-dt*3.5));
  const sx=shake>0?(Math.random()-.5)*shake*1.6:0,sz=shake>0?(Math.random()-.5)*shake*1.6:0;shake=Math.max(0,shake-dt*2.2);
  camera.position.set(camTarget.x+sx,52*zoom,camTarget.z+36*zoom+sz);camera.lookAt(camTarget.x+sx*.5,0,camTarget.z+sz*.5);
  hudT-=dt;if(hudT<=0){hudT=.12;updateHUD()}
  miniT-=dt;if(miniT<=0){miniT=.08;drawMini()}
  saveT+=dt;if(saveT>6){saveT=0;save()}
  renderer.render(scene,camera)}

addEventListener('visibilitychange',()=>{if(document.hidden&&state)save()});
window.claude?.hot?.snapshot?.(()=>({state}));
function start(data){const hs=data&&data.state;state=(hs&&hs.v===3)?hs:(loadState()||freshState());
  let stored=null;try{stored=localStorage.getItem('os-lang')}catch(e){}
  if(!stored&&(state.lang==='sk'||state.lang==='en'))lang=state.lang;state.lang=lang;
  pendingDiff=state.diff||'easy';
  $('#intro').hidden=!!state.intro;
  resize();buildSector();ship.position.set(0,0,STATION_R+8);camTarget.copy(ship.position);

window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
