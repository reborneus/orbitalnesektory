<!doctype html><meta charset="utf-8">
<!-- Generátor ikony hry: galaxia z 2.5D pohľadu (naklonený disk so špirálovými ramenami) a písmená OS v strede.
     Obežná dráha je rozdelená na zadnú a prednú polovicu, aby písmená vyzerali, že sú "v" galaxii.
     Spustenie: node tools/make_icon.js (vykreslí PNG v rôznych veľkostiach a icon.ico do assets/). -->
<canvas id="c"></canvas>
<script>
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function draw(S,simple){const c=document.getElementById('c');c.width=c.height=S;const g=c.getContext('2d');const r=rng(7);const k=S/1024;
  // podklad: zaoblený štvorec s hlbokým vesmírom
  const R=S*.22;g.save();g.beginPath();g.roundRect(0,0,S,S,R);g.clip();
  let bg=g.createLinearGradient(0,0,S,S);bg.addColorStop(0,'#0b1730');bg.addColorStop(1,'#04060d');g.fillStyle=bg;g.fillRect(0,0,S,S);
  g.globalCompositeOperation='lighter';
  for(const [x,y,rad,col] of [[.25,.2,.55,'rgba(88,208,192,.20)'],[.8,.85,.6,'rgba(179,107,255,.22)'],[.85,.15,.35,'rgba(74,157,255,.14)']]){
    const n=g.createRadialGradient(x*S,y*S,0,x*S,y*S,rad*S);n.addColorStop(0,col);n.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=n;g.fillRect(0,0,S,S)}
  // pozadie hviezd
  if(!simple)for(let i=0;i<260;i++){const x=r()*S,y=r()*S,s=(r()*1.6+.3)*k*2;g.fillStyle=`rgba(255,255,255,${.25+r()*.6})`;g.fillRect(x,y,s,s)}
  // galaxia: naklonený disk (2.5D) -> rotácia a stlačenie v osi y
  const cx=S/2,cy=S*.52,tilt=.46,rot=-.32;
  const toScreen=(x,y)=>{const xr=x*Math.cos(rot)-y*Math.sin(rot),yr=(x*Math.sin(rot)+y*Math.cos(rot))*tilt;return[cx+xr,cy+yr]};
  const arms=2,N=simple?420:5200;
  // 1) mäkká žiara ramien (veľké priehľadné škvrny)
  for(let a=0;a<arms;a++)for(let i=0;i<(simple?40:260);i++){const f=i/(simple?40:260);const th=f*Math.PI*2.4+a*Math.PI;const rad=(.05+f*.42)*S;
    const [x,y]=toScreen(Math.cos(th)*rad,Math.sin(th)*rad);const gr=g.createRadialGradient(x,y,0,x,y,S*(.05+f*.05));
    const col=f<.3?'255,190,120':f<.65?'255,110,200':'110,150,255';gr.addColorStop(0,`rgba(${col},${(simple?.22:.09)*(1.2-f)})`);gr.addColorStop(1,`rgba(${col},0)`);
    g.fillStyle=gr;g.fillRect(x-S*.12,y-S*.12,S*.24,S*.24)}
  // 2) hviezdy pozdĺž logaritmickej špirály; ďalej od stredu chladnejšie farby
  for(let a=0;a<arms;a++)for(let i=0;i<N;i++){const f=Math.pow(r(),.8);const th=f*Math.PI*2.4+a*Math.PI;const rad=(.05+f*.42)*S;
    const spread=S*(.006+f*.026);const j=(r()-.5)*spread*2,jj=(r()-.5)*spread*2;const [x,y]=toScreen(Math.cos(th)*rad+j,Math.sin(th)*rad+jj);
    const hue=f<.3?38:f<.62?320+(r()*30):215+r()*40;const l=f<.3?85:72;const s=(simple?2.6:.8+r()*1.9)*k;
    g.fillStyle=`hsla(${hue},95%,${l}%,${(simple?.7:.45)+(1-f)*.35})`;g.beginPath();g.arc(x,y,s,0,Math.PI*2);g.fill()}
  // 3) rozptýlené hviezdy disku medzi ramenami
  if(!simple)for(let i=0;i<1400;i++){const rad=Math.sqrt(r())*S*.47,th=r()*Math.PI*2;const [x,y]=toScreen(Math.cos(th)*rad,Math.sin(th)*rad);
    g.fillStyle=`rgba(200,220,255,${.15+r()*.35})`;g.fillRect(x,y,1.6*k,1.6*k)}
  // jasné jadro (výrazná žiara presahuje za písmená)
  const core=g.createRadialGradient(cx,cy,0,cx,cy,S*.26);core.addColorStop(0,'rgba(255,248,225,1)');core.addColorStop(.18,'rgba(255,214,150,.75)');core.addColorStop(.5,'rgba(255,150,90,.25)');core.addColorStop(1,'rgba(255,120,60,0)');
  g.save();g.translate(cx,cy);g.rotate(rot);g.scale(1.5,tilt*1.3);g.translate(-cx,-cy);g.fillStyle=core;g.beginPath();g.arc(cx,cy,S*.26,0,Math.PI*2);g.fill();g.restore();
  g.globalCompositeOperation='source-over';
  // obežná dráha (zadná polovica pred písmenami)
  const orbit=(from,to,w,a)=>{g.save();g.translate(cx,cy);g.rotate(rot);g.beginPath();g.ellipse(0,0,S*.45,S*.45*tilt,0,from,to);g.strokeStyle=`rgba(127,246,255,${a})`;g.lineWidth=w;g.shadowColor='#58d0c0';g.shadowBlur=14*k;g.stroke();g.restore()};
  orbit(Math.PI,Math.PI*2,(simple?16:7)*k,.55);
  // písmená OS
  const fs=(simple?560:300)*k;g.font=`900 ${fs}px "Inter Display","Inter","DejaVu Sans",sans-serif`;g.textAlign='center';g.textBaseline='middle';
  const ty=cy-S*.005;let tg=g.createLinearGradient(0,ty-fs*.45,0,ty+fs*.45);tg.addColorStop(0,'#ffffff');tg.addColorStop(.55,'#c9fff6');tg.addColorStop(1,'#58d0c0');
  g.lineJoin='round';g.lineWidth=(simple?44:20)*k;g.strokeStyle='rgba(4,10,22,.92)';g.strokeText('OS',cx,ty);
  g.shadowColor='rgba(127,246,255,.85)';g.shadowBlur=(simple?16:40)*k;g.fillStyle=tg;g.fillText('OS',cx,ty);g.shadowBlur=0;
  // predná polovica dráhy cez písmená + malý satelit (stanica) na dráhe
  orbit(0,Math.PI,(simple?16:7)*k,.9);
  if(!simple){const an=.72;const sx=Math.cos(an)*S*.45,sy=Math.sin(an)*S*.45*tilt;g.save();g.translate(cx,cy);g.rotate(rot);
    const sg=g.createRadialGradient(sx,sy,0,sx,sy,30*k);sg.addColorStop(0,'#ffffff');sg.addColorStop(.3,'#ffd27a');sg.addColorStop(1,'rgba(255,210,122,0)');g.fillStyle=sg;g.beginPath();g.arc(sx,sy,30*k,0,Math.PI*2);g.fill();g.restore()}
  g.restore();
  // jemný okraj
  g.beginPath();g.roundRect(1,1,S-2,S-2,R);g.strokeStyle='rgba(127,246,255,.35)';g.lineWidth=Math.max(1,3*k);g.stroke();
  return c.toDataURL('image/png')}
</script>
